<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VELNAR</title>
  <link rel="stylesheet" href="../styles/variables.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="statusMessage" class="gs-status" role="status" aria-live="polite" hidden></div>
  <div class="gs-popup">
    <div class="gs-popup-header">
      <div class="gs-logo">
        <img class="gs-logo-img" src="../icons/velnar-mark.svg" alt="VELNAR" />
        <span>VELNAR<small id="extensionState">Active on GitHub</small></span>
      </div>
      <button type="button" class="gs-switch" id="enabledSwitch" role="switch" aria-checked="false" aria-label="Enable extension"></button>
    </div>

    <div id="autoDarkBanner" class="gs-banner" hidden>
      System appearance is on. Choosing a theme switches to manual mode. <button id="btnDisableAutoDark" class="gs-banner-link">turn it off</button>.
    </div>

    <div class="gs-popup-section">
      <label class="sr-only" for="themeSearch">Search themes</label><input id="themeSearch" class="gs-input gs-popup-search" type="search" placeholder="Find your theme…" />
      <div class="gs-popup-label">Your palette <span id="themeCount"></span></div>
      <div class="gs-theme-grid" id="themeGrid"></div><p id="themeEmpty" hidden>No themes found.</p>
    </div>

    <div class="gs-popup-section gs-row-2">
      <button class="gs-btn gs-btn-ghost" id="btnRandom">🎲 Random</button>
      <button class="gs-btn gs-btn-ghost" id="btnAnimations">✨ Animations</button>
    </div>

    <div class="gs-popup-footer">
      <button class="gs-btn gs-btn-ghost" id="btnReset">Reset Theme</button>
      <button class="gs-btn" id="btnSettings">Open Settings</button>
    </div>

    <a class="vn-preview-link" href="../preview/preview.html" target="_blank">Explore the 15 cinematic themes ↗</a>
    <div class="gs-popup-hint">Ctrl+Shift+G to toggle · Alt+Shift+R for random</div>
  </div>

  <script src="../utils/constants.js"></script>
  <script src="../themes/presets.js"></script>
  <script src="../themes/character-art.js"></script>
  <script src="../themes/collection-art.js"></script><script src="../themes/scene-art.js"></script>
  <script src="../utils/validator.js"></script>
  <script src="../utils/storage.js"></script>
  <script src="../utils/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
